name: Check Whiteboat water release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:community
      - name: Upload community source scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-source-scans
          path: community-check-reports/
          if-no-files-found: error
      - run: npm run test:community-source && npm test && npm --prefix vendor/whiteboat-core test && npm run check:release && node --check main.js
